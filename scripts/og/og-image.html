<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* Figtree (SIL Open Font License), latin subset, inlined by make-og-image.mjs. */
  @font-face { font-family: "Figtree"; font-style: normal; font-weight: 500 800; src: url(data:font/woff2;base64,{{font}}) format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: {{offwhite}}; color: {{charcoal}}; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; }
  .frame { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .rule { position: absolute; left: 0; right: 0; top: 0; height: 14px; background: {{blue}}; }
  .lockup { display: flex; align-items: center; gap: 40px; }
  .mark { width: 150px; height: 180px; flex: none; }
  .name { font-weight: 800; font-size: 60px; line-height: 1.05; letter-spacing: 0.04em; }
  .name span { display: block; font-size: 34px; letter-spacing: 0.12em; margin-bottom: 8px; }
  .tagline { font-weight: 500; font-size: 40px; line-height: 1.3; color: {{charcoal}}; max-width: 1040px; }
  .foot { display: flex; align-items: baseline; justify-content: space-between; gap: 32px; border-top: 2px solid {{hairline}}; padding-top: 28px; font-size: 26px; font-weight: 600; color: {{slate}}; }
  .phone { color: {{blue}}; font-weight: 800; font-size: 34px; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="frame">
    <div class="rule"></div>
    <div class="lockup"><svg width="850" height="241" viewBox="256 157 1504 426" style="mix-blend-mode:multiply"><image href="data:image/png;base64,{{logo}}" width="2169" height="725" /></svg></div>
    <div class="tagline">{{tagline}}</div>
    <div class="foot">
      <div>{{based}}</div>
      <div class="phone">{{phone}}</div>
    </div>
  </div>
</body>
</html>
