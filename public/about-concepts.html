<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>About page concepts</title><style>body{margin:0;background:#edf1f5;color:#182b50;font-family:Arial,sans-serif}header{padding:20px;position:sticky;top:0;background:white;z-index:5;border-bottom:1px solid #ccd7e1}h1{font-size:24px;margin:0 0 12px}button,a{display:inline-block;padding:12px;border:1px solid #087bcc;border-radius:4px;color:#087bcc;background:white;font-weight:bold;margin:3px;text-decoration:none}button.active{background:#087bcc;color:white}p{line-height:1.5}#stage{position:relative;margin:16px auto;overflow:hidden;background:white;box-shadow:0 2px 12px #0002}iframe{border:0;transform-origin:top left;background:white}small{display:block;margin:10px 0}</style></head><body><header><h1>About page concepts</h1><div><button id="owner" class="active" onclick="concept='owner';refresh()">1 · Meet Ryan</button><button id="craft" onclick="concept='craft';refresh()">2 · How We Work</button></div><div><button id="phone" class="active" onclick="mode='phone';refresh()">Phone</button><button id="desktop" onclick="mode='desktop';refresh()">Desktop</button><a id="direct" href="/about-preview/owner" target="_blank">Open full page ↗</a></div><small>Choose a concept and screen size. Scroll inside the preview to see the complete page.</small></header><div id="stage"><iframe id="frame" title="About page design preview" src="/about-preview/owner"></iframe></div><script>let concept='owner',mode='phone';function refresh(){let w=mode==='phone'?390:1440;let available=Math.min(innerWidth-24,1440);let scale=Math.min(1,available/w);let h=mode==='phone'?844:1000;let f=document.getElementById('frame'),s=document.getElementById('stage');if(!f.src.endsWith('/'+concept))f.src='/about-preview/'+concept;f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+scale+')';s.style.width=w*scale+'px';s.style.height=h*scale+'px';document.getElementById('direct').href='/about-preview/'+concept;['owner','craft','phone','desktop'].forEach(x=>document.getElementById(x).classList.toggle('active',x===concept||x===mode))}addEventListener('resize',refresh);refresh();</script></body></html>
